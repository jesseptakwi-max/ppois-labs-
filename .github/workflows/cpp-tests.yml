
name: C++ Lab 1 Build, Tests, Coverage and Release

on:
  push:
    branches:
      - main
      - construct1
      - testing-and-coverage
    tags:
      - 'v*'

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  polynomial:
    name: Polynomial - build, tests, coverage and static analysis
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes catch2 gcovr clang-tidy

      - name: Compile Polynomial application
        working-directory: lab1/Polynomial
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Isrc \
            src/Polynomial.cpp src/Polynomial_cli.cpp \
            -o polynomial_app

      - name: Compile Polynomial tests with coverage
        working-directory: lab1/Polynomial
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic \
            --coverage -O0 -g -Isrc \
            src/Polynomial.cpp tests/Polynomial_tests.cpp \
            -lCatch2Main -lCatch2 \
            -o polynomial_tests

      - name: Run Polynomial tests
        working-directory: lab1/Polynomial
        run: ./polynomial_tests

      - name: Check Polynomial line coverage (strictly above 90%)
        working-directory: lab1/Polynomial
        run: |
          gcovr --root . --filter 'src/Polynomial\.cpp$' \
            --fail-under-line 90.01 --print-summary

      - name: Run Polynomial static analysis
        working-directory: lab1/Polynomial
        run: |
          clang-tidy src/Polynomial.cpp src/Polynomial_cli.cpp tests/Polynomial_tests.cpp \
            --checks='clang-analyzer-*,bugprone-*,performance-*' \
            --warnings-as-errors='clang-analyzer-*' \
            -- -std=c++17 -Isrc

  tictactoe:
    name: Tic-Tac-Toe - build, tests, coverage and static analysis
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes catch2 gcovr clang-tidy

      - name: Compile Tic-Tac-Toe application
        working-directory: lab1/tictactoe
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Isrc \
            src/TicTacToe.cpp src/TicTacToe_cli.cpp \
            -o tictactoe_app

      - name: Compile Tic-Tac-Toe tests with coverage
        working-directory: lab1/tictactoe
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic \
            --coverage -O0 -g -Isrc \
            src/TicTacToe.cpp tests/TicTacToe_tests.cpp \
            -lCatch2Main -lCatch2 \
            -o tictactoe_tests

      - name: Run Tic-Tac-Toe tests
        working-directory: lab1/tictactoe
        run: ./tictactoe_tests

      - name: Check Tic-Tac-Toe line coverage (strictly above 90%)
        working-directory: lab1/tictactoe
        run: |
          gcovr --root . --filter 'src/TicTacToe\.cpp$' \
            --fail-under-line 90.01 --print-summary

      - name: Run Tic-Tac-Toe static analysis
        working-directory: lab1/tictactoe
        run: |
          clang-tidy src/TicTacToe.cpp src/TicTacToe_cli.cpp tests/TicTacToe_tests.cpp \
            --checks='clang-analyzer-*,bugprone-*,performance-*' \
            --warnings-as-errors='clang-analyzer-*' \
            -- -std=c++17 -Isrc

  release:
    name: Package and publish Linux applications
    runs-on: ubuntu-24.04
    needs:
      - polynomial
      - tictactoe
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Compile Polynomial application
        working-directory: lab1/Polynomial
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Isrc \
            src/Polynomial.cpp src/Polynomial_cli.cpp \
            -o polynomial

      - name: Compile Tic-Tac-Toe application
        working-directory: lab1/tictactoe
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Isrc \
            src/TicTacToe.cpp src/TicTacToe_cli.cpp \
            -o tictactoe

      - name: Package applications
        run: |
          mkdir -p dist
          cp lab1/Polynomial/polynomial dist/
          cp lab1/tictactoe/tictactoe dist/
          cp README.md dist/
          tar -czf ppois-lab1-linux-x86_64.tar.gz -C dist .

      - name: Create GitHub Release and upload applications
        uses: softprops/action-gh-release@v2
        with:
          name: PPOIS Labs ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ppois-lab1-linux-x86_64.tar.gz
          fail_on_unmatched_files: true


  macos-release:
    name: Package and publish macOS applications
    runs-on: macos-15
    needs:
      - release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify macOS architecture
        run: |
          uname -m

      - name: Compile Polynomial application
        working-directory: lab1/Polynomial
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Isrc \
            src/Polynomial.cpp src/Polynomial_cli.cpp \
            -o polynomial

      - name: Compile Tic-Tac-Toe application
        working-directory: lab1/tictactoe
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Isrc \
            src/TicTacToe.cpp src/TicTacToe_cli.cpp \
            -o tictactoe

      - name: Package macOS applications
        run: |
          mkdir -p dist
          cp lab1/Polynomial/polynomial dist/
          cp lab1/tictactoe/tictactoe dist/
          cp README.md dist/
          tar -czf ppois-lab1-macos-arm64.tar.gz -C dist .

      - name: Upload macOS applications to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PPOIS Labs ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: ppois-lab1-macos-arm64.tar.gz
          fail_on_unmatched_files: true
